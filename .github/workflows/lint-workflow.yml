name: Code style check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    name: Coding style
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_coding_style.yml@v1

  misspell:
    name: Check misspellings
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check misspellings
        uses: codespell-project/actions-codespell@2391250ab05295bddd51e36a8c6295edb6343b0e
        with:
          builtin: clear,rare
          check_filenames: true
