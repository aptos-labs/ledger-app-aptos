name: Code style check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Coding style
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_coding_style.yml@1a91c93f735d24e9dffd0d2337a4ea4129cdedd4 # v1

  misspell:
    name: Check misspellings
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check misspellings
        uses: codespell-project/actions-codespell@2391250ab05295bddd51e36a8c6295edb6343b0e
        with:
          builtin: clear,rare
          check_filenames: true
