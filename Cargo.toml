[package]
name = "ledger-app-aptos"
version = "1.9.1"
authors = ["Ledger"]
edition = "2021"

[dependencies]
ledger_device_sdk = {version = "=1.42.2", features = ["io_new", "aptos_apdu"]}
serde = { version="1.0.192", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"
hex = { version = "0.4.3", default-features = false, features = ["serde", "alloc"] }
numtoa = "0.2.4"
arrayvec = { version = "0.7", default-features = false }

[patch.crates-io]
# The 1.42.2 IO parser accepts missing Lc and emits 0x6E03 for malformed APDUs.
# Keep the v1 0x6A87 contract until the SDK supports per-app APDU error policy.
ledger_device_sdk = { path = "vendor/ledger_device_sdk" }

[build-dependencies]
# Decode the source GIFs and write the processed grayscale PNG glyph without
# pulling the full `image` crate (and its color-management stack). The luma
# conversion in build.rs reproduces `image::into_luma8()`.
gif = "0.14"
png = "0.18"

[features]
default = ["ledger_device_sdk/nano_nbgl"]
debug = ["ledger_device_sdk/debug"]
variant_testnet = ["ledger_device_sdk/variant_0"]
variant_betanet = ["ledger_device_sdk/variant_1"]

[package.metadata.ledger]
curve = ["ed25519"]
flags = "0x800"
path = ["44'/637'"]
name = "Aptos"
nanosplus = { icon = "icons/app_aptos_14px.gif" }
nanox = { icon = "icons/app_aptos_14px.gif" }
stax = { icon = "icons/app_aptos_32px.gif" }
flex = { icon = "icons/app_aptos_40px.gif" }
apex_p = { icon = "icons/app_aptos_32px_apex.png" }

[package.metadata.ledger.variants.0]
name = "Aptos Testnet"

[package.metadata.ledger.variants.1]
name = "Aptos Betanet"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanos", "nanox", "nanosplus"))'] }

