[target.apex_p]
runner = "speculos -m apex_p"

[build]
target = "apex_p"

[profile.release]
opt-level = 'z'
lto = true

# Uncomment the line below to generate a map file
# rustflags = ["-Clink-args=-Map=app.map"]

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]

# The Rust heap is kept small on Nano X so v1's 22,950-byte transaction
# buffer plus the stack still fit in the device's 28 KiB SRAM.
[env]
HEAP_SIZE = "nanox: 2048"
